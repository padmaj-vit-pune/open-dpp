name: CI/CD Pipeline - Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main  # Triggers automatically every time you push to main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Pnpm Package Manager
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Set up Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install

      - name: Build Project
        run: pnpm run build
        # Compiles TypeScript and builds production artifacts into the 'dist' folder

      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: 'open-dpp' # Ensure this matches your Cloudflare Pages project name
          directory: 'dist'      # The production output directory built by Vite
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
